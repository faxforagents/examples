name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: the examples parse, lint and hold their facts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: sh scripts/truthcheck.sh
      - name: Python agent compiles and lints
        run: |
          pip install ruff faxforagents
          python -m py_compile python-agent/agent.py
          ruff check python-agent
      - name: Shell scripts parse
        run: sh -n curl/flow.sh
      - name: JSON files parse
        run: |
          for f in n8n/workflow.json claude-code/.mcp.json typescript-agent/package.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8')); console.log('ok $f')"
          done
      - name: TypeScript agent typechecks
        working-directory: typescript-agent
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit

  live:
    name: the python agent and the curl flow run on the sandbox (needs the secret)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    env:
      FAXFORAGENTS_API_KEY: ${{ secrets.FAXFORAGENTS_TEST_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Skip without a key
        if: env.FAXFORAGENTS_API_KEY == ''
        run: echo "FAXFORAGENTS_TEST_KEY is not configured, skipping"
      - name: Python agent
        if: env.FAXFORAGENTS_API_KEY != ''
        run: pip install faxforagents && python python-agent/agent.py --to +15550000001 --text "CI run"
      - name: curl flow
        if: env.FAXFORAGENTS_API_KEY != ''
        run: sh curl/flow.sh +15550000001
